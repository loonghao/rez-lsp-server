[workspace]
# Workspace defaults — single-package repo so all settings are in [[package]]
changelog_update = false
git_release_enable = false
git_tag_enable = false
release = false

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

[[package]]
name = "rez-lsp-server"
# Enable changelog generation for this package
changelog_update = true
# Create a GitHub release when a tag is pushed
git_release_enable = true
# Let release-plz create the git tag automatically after PR merge
git_tag_enable = true
# Enable release processing (crates.io publish + tag)
release = true
# Tag format: v0.1.2 — triggers vscode-extension.yml to build and attach .vsix
git_tag_name = "v{{version}}"
