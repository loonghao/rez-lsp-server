name: VSCode Extension

on:
  push:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  CARGO_TERM_COLOR: always

jobs:
  # ── Lint & unit-test the TypeScript extension ────────────────────────────
  lint_and_test:
    name: Lint and Test Extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Lint
        working-directory: vscode-extension
        run: npm run lint

      - name: Build (TypeScript → JS)
        working-directory: vscode-extension
        run: npm run vite:build

      - name: Validate package.json (vsce dry-run)
        working-directory: vscode-extension
        shell: bash
        run: |
          npx @vscode/vsce package --out /tmp/test-validate.vsix --no-dependencies
          echo "Validation package created OK"

  # ── Build the Rust LSP server for each target ────────────────────────────
  build_server:
    name: Build LSP server (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            vsix_target: linux-x64
            binary: rez-lsp-server
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            vsix_target: linux-arm64
            binary: rez-lsp-server
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vsix_target: win32-x64
            binary: rez-lsp-server.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            vsix_target: darwin-x64
            binary: rez-lsp-server
          - os: macos-latest
            target: aarch64-apple-darwin
            vsix_target: darwin-arm64
            binary: rez-lsp-server

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.vsix_target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          retention-days: 1

  # ── Package per-platform .vsix (server binary embedded) ──────────────────
  package_vsix:
    name: Package .vsix (${{ matrix.vsix_target }})
    runs-on: ubuntu-latest
    needs: [lint_and_test, build_server]
    strategy:
      fail-fast: false
      matrix:
        include:
          - vsix_target: linux-x64
            binary: rez-lsp-server
          - vsix_target: linux-arm64
            binary: rez-lsp-server
          - vsix_target: win32-x64
            binary: rez-lsp-server.exe
          - vsix_target: darwin-x64
            binary: rez-lsp-server
          - vsix_target: darwin-arm64
            binary: rez-lsp-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Build TypeScript
        working-directory: vscode-extension
        run: npm run vite:build

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-${{ matrix.vsix_target }}
          path: vscode-extension/server/

      - name: Make server executable (Unix)
        if: "!startsWith(matrix.vsix_target, 'win32')"
        run: chmod +x vscode-extension/server/${{ matrix.binary }}

      - name: Get version
        id: version
        working-directory: vscode-extension
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Package .vsix
        working-directory: vscode-extension
        run: |
          VSIX_NAME="rez-lsp-extension-${{ steps.version.outputs.version }}-${{ matrix.vsix_target }}.vsix"
          npx @vscode/vsce package \
            --target ${{ matrix.vsix_target }} \
            --out "$VSIX_NAME" \
            --no-dependencies
          echo "VSIX_NAME=$VSIX_NAME" >> $GITHUB_ENV
          echo "Packaged: $VSIX_NAME"
          ls -lh "$VSIX_NAME"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vsix_target }}
          path: vscode-extension/rez-lsp-extension-*.vsix
          retention-days: 30

  # ── Summarise all artifacts ──────────────────────────────────────────────
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: package_vsix
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix-packages/
          merge-multiple: true

      - name: List packages
        run: |
          echo "## VSCode Extension Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|------|" >> $GITHUB_STEP_SUMMARY
          find vsix-packages/ -name "*.vsix" | sort | while read f; do
            SIZE=$(du -sh "$f" | cut -f1)
            NAME=$(basename "$f")
            echo "| ${NAME%%.vsix} | $NAME | $SIZE |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install any package with:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "code --install-extension rez-lsp-extension-<version>-<platform>.vsix" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── Publish to Marketplace on main push ──────────────────────────────────
  publish:
    name: Publish to Marketplace
    runs-on: ubuntu-latest
    needs: package_vsix
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: vscode-marketplace

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all .vsix packages
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix-packages/
          merge-multiple: true

      - name: List packages for publish
        run: find vsix-packages/ -name "*.vsix" | sort

      - name: Publish to Open VSX Registry
        continue-on-error: true
        run: |
          for vsix in vsix-packages/*.vsix; do
            echo "Publishing $vsix to Open VSX..."
            npx ovsx publish "$vsix" -p ${{ secrets.OPEN_VSX_TOKEN }} || echo "Failed: $vsix"
          done

      - name: Publish to VS Marketplace
        continue-on-error: true
        run: |
          for vsix in vsix-packages/*.vsix; do
            echo "Publishing $vsix to VS Marketplace..."
            npx @vscode/vsce publish --packagePath "$vsix" -p ${{ secrets.VSCODE_MARKETPLACE_TOKEN }} || echo "Failed: $vsix"
          done
