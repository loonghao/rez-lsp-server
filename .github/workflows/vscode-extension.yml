name: VSCode Extension

# CI workflow for pull requests and development pushes.
# For release builds (triggered by v* tags via release-plz), see release.yml.

on:
  push:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Lint & build check the TypeScript extension ───────────────────────────
  lint_and_test:
    name: Lint and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # vx manages Node.js version from vx.toml (node = "22")
      - name: Setup vx
        uses: loonghao/vx@main
        with:
          tools: node

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm install

      - name: Lint
        working-directory: vscode-extension
        run: npm run lint

      - name: Build (TypeScript → JS)
        working-directory: vscode-extension
        run: npm run vite:build

      - name: Validate package manifest
        working-directory: vscode-extension
        shell: bash
        run: |
          npx --yes @vscode/vsce package --out /tmp/test-validate.vsix --no-dependencies
          echo "Package validation OK"

  # ── Quick Rust build check (linux only, no cross-compile) ────────────────
  build_server_check:
    name: Build server (linux-x64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release
